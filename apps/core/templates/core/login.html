{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Jude! — Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          coffee: {
            50:  '#FAF6F1',
            100: '#F3E9DD',
            700: '#4A3626',
            900: '#2A1E15',
          },
          amber: {
            600: '#B8791E',
            700: '#9C641A',
          },
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
</style>
</head>
<body class="bg-coffee-50 font-body text-coffee-900">

<div class="min-h-screen flex">

  <!-- Left panel: brand / illustration -->
  <div class="hidden lg:flex lg:w-1/2 bg-coffee-900">
    <img src="{% static 'images/girl-smile.png' %}" alt="girl-smile" class="w-full h-full object-cover block">
  </div>

  <!-- Right panel: form -->
  <div class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">

      <div class="flex items-center gap-2 mb-10 lg:hidden">
        <svg class="w-7 h-7 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 9h13a2 2 0 0 1 2 2 4 4 0 0 1-4 4h-1" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 9v6a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="font-display text-lg text-coffee-900">Hey Jude!</span>
      </div>

      <h2 class="font-display text-2xl text-coffee-900 mb-1">Admin sign in</h2>
      <p class="text-sm text-coffee-900/60 mb-8">Enter your staff credentials to continue.</p>

      <form method="POST" action="{% url 'admin_login' %}" class="space-y-5">
        {% csrf_token %}
        <div>
          <label for="username" class="block text-sm font-medium text-coffee-900 mb-1.5">Username</label>
          <input
            id="username" name="username" type="text" autocomplete="username" required
            class="w-full px-4 py-2.5 rounded-lg border border-coffee-900/15 bg-white text-coffee-900 placeholder-coffee-900/30
                   focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600 transition"
            placeholder="e.g. barista01"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-coffee-900 mb-1.5">Password</label>
          <div class="relative">
            <input
              id="password" name="password" type="password" autocomplete="current-password" required
              class="w-full px-4 py-2.5 pr-11 rounded-lg border border-coffee-900/15 bg-white text-coffee-900 placeholder-coffee-900/30
                     focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600 transition"
              placeholder="••••••••"
            >
            <button
              type="button" id="togglePassword" aria-label="Show password"
              class="absolute inset-y-0 right-0 flex items-center px-3.5 text-coffee-900/40 hover:text-coffee-900/70"
            >
              <svg id="eyeIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <a href="#" class="text-sm font-medium text-amber-700 hover:text-amber-600 underline underline-offset-2">
            Forgot password
          </a>
        </div>

        <button
          type="submit"
          class="w-full py-2.5 rounded-lg bg-amber-600 text-white font-medium hover:bg-amber-700 active:bg-amber-700
                 transition shadow-sm"
        >
          Login
        </button>
      </form>

      <p class="text-center text-xs text-coffee-900/40 mt-10">
        Trouble logging in?
        <a href="#" class="underline underline-offset-2 hover:text-coffee-900/60">Contact developers</a>
      </p>
    </div>
  </div>

</div>

<script>
  // Only bit of JS: toggling password visibility.
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    eyeIcon.style.opacity = isHidden ? '0.6' : '1';
  });
</script>

</body>
</html>
